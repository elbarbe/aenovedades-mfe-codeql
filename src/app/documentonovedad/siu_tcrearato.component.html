<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-preload [field]="ptUsuario" *ngIf="ptUsuario.visible" (selected)="onptusuarioChange()"></imes-preload>
            <imes-input-definedselection [field]="ptupuatrTipo" *ngIf="ptupuatrTipo.visible" (valueChanged)="onptupuatrtipoChange()"></imes-input-definedselection>
            <imes-input-string [field]="ptupuatrDescripcion" *ngIf="ptupuatrDescripcion.visible"></imes-input-string>




            <imes-input-blob [field]="pfFichero" *ngIf="pfFichero.visible"></imes-input-blob>


        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
