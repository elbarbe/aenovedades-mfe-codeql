    <genericsiu *ngIf="selector=='genericsiu'"></genericsiu>

    <imes-solicitudnovedad-siu-modificarnummeses *ngIf="selector=='imes-solicitudnovedad-siu-modificarnummeses'"></imes-solicitudnovedad-siu-modificarnummeses>

    <imes-familianovedad-siu-tmodificarmanual *ngIf="selector=='imes-familianovedad-siu-tmodificarmanual'"></imes-familianovedad-siu-tmodificarmanual>
    <imes-usuarionovedad-siu-tmodificarmanual *ngIf="selector=='imes-usuarionovedad-siu-tmodificarmanual'"></imes-usuarionovedad-siu-tmodificarmanual>
    <imes-usuarionovedad-siu-tcambiarparentesco *ngIf="selector=='imes-usuarionovedad-siu-tcambiarparentesco'"></imes-usuarionovedad-siu-tcambiarparentesco>
    <imes-usuarionovedad-siu-tcambiartipoident *ngIf="selector=='imes-usuarionovedad-siu-tcambiartipoident'"></imes-usuarionovedad-siu-tcambiartipoident>
    <imes-usuarionovedad-siu-cambiarexcluido *ngIf="selector=='imes-usuarionovedad-siu-cambiarexcluido'"></imes-usuarionovedad-siu-cambiarexcluido>

</p-dialog>
